<h1>🧩 نونوغرام (Nonogram)</h1>
<p class="howto">اضغط على المربعات لتعبئتها حسب الأرقام — الأرقام تقول كم مربعاً متتالياً يُملأ في كل صف وعمود — حتى تظهر الصورة المخفية.</p>

<div class="card">
  <div class="nono-controls board-ltr" dir="ltr">
    <label>اللغز:
      <select id="puzzle"></select>
    </label>
    <button type="button" id="modeFill" class="btn">⬛ تعبئة</button>
    <button type="button" id="modeMark" class="btn btn-ghost">✕ تعليم</button>
    <button type="button" id="clear" class="btn btn-ghost">مسح</button>
  </div>
  <div id="status" class="status">اختر «تعبئة» واضغط على المربعات الصحيحة. زر «تعليم» يضع ✕ على المربعات الفارغة.</div>
  <div class="board-ltr" dir="ltr">
    <div id="grid" class="nono-grid" role="grid" aria-label="لوحة النونوغرام"></div>
  </div>
</div>
