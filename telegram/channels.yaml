# The scheduled cloud job (telegram-sync.yml) runs
# `tbi index --backfill --backfill-block 3000`: new posts first,
# then one 3000-post block below the oldest indexed post per
# channel per run, so deep history fills in over successive runs.
# limit_per_channel: 0 means the local default walk is uncapped;
# the backfill block size is a CLI flag, not this setting.
settings:
  db: index.db
  delay_seconds: 1.5   # polite pause between preview pages
  limit_per_channel: 0  # 0 = walk until the preview stops serving posts
