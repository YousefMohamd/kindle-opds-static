# CLASSIFICATION (verified live 2026-11-06 by probing t.me/s/ and t.me/<handle>):
#   * Batch 1 (29 sources): 2 public channels + 8 reclassified as walkable
#     on re-probe + 16 groups + 3 dead (handles that do not exist).
#   * Batch 2 (200 new handles): 41 walkable + 152 groups + 7 dead.
#   * Totals: 51 sources live-scraped from the public preview;
#     v0.3 (2026-11-07): 8 of them dropped from the ACTIVE list
#     (0 book files in the full first run) — see '# Dropped'
#     below. 43 channels are active now.
#     168 groups, each indexed from a Telegram Desktop JSON export
#     (see README for the steps). Uncomment a group entry once you
#     have exported it. 10 dead handles are listed at the bottom
#     (do NOT add them as export entries — they do not exist).
#     v0.4.4: EBook_Library is the FIRST group active — via the API
#     (no export; the owner is a member, so Telethon reads its
#     history). The other 167 groups stay commented out until each
#     is verified the same way.
#     6 private invite links are listed at the bottom (cannot be
#     indexed without joining). Full tables:
#     ~/workspace/kindle-quiet-prep/telegram-sources-batch2.md
#   * Method note: a first probe called 16 handles 'dead' from an
#     empty info page; a re-check revived 6 of them (they exist).
#     Dead verdicts here needed TWO empty info pages. A second
#     classify pass over all 169 group handles flipped exactly one
