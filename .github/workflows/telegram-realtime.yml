# Telegram real-time sync — frequent new-only check (v2.1, sync-fix).
#
# Runs `tbi.live_sync` and writes any new book posts to the bot
# Worker's Durable Object live-additions key (`live:additions`)
# immediately, through the bot's /api/live-state/batch endpoint
# (Bearer LIVE_SYNC_TOKEN). The bot's /resources and the Telegram
# search endpoint read that key, so a new book is visible within
# ~10-12 minutes of being posted — without waiting for the daily
# 03:00 UTC sync and its Pages deploy.
#
# TRIGGER OF TRUTH (v2.1 — the radical fix): there is NO `schedule:`
# in this file anymore. The ONLY trigger is the 10-minute dispatcher
# cron (Muse cron rlibook-realtime-trigger), which dispatches this
# workflow via workflow_dispatch AND skips the dispatch while the
# previous run is still in_progress. The old YAML `*/5` schedule
# was a SECOND trigger firing on top of the dispatcher: with a
# ~10.75-minute worst-case scan against a 10-minute trigger, the
# two triggers queued overlapping identical scans against the same
# DO cursor and the same Telegram session. GitHub's own cron also
# drifts 5-30 minutes, which is why the dispatcher exists at all.
# If the dispatcher ever dies, trigger this workflow manually
# (workflow_dispatch) — do NOT re-add a YAML schedule without
# removing the dispatcher first. One trigger, never two.
#
# OVERLAP DEDUP (three layers, cheapest first):
#   1. The dispatcher skips while the previous run is in_progress.
#   2. The "Skip if another run is in progress" step below sets
#      skip=true and the rest of the job does not run (a skip is
#      quiet success, not a failure — the next tick retries).
#   3. The runner claims a DO lease (live:lease) before connecting;
#      a live lease refuses the run (exit 0, quiet success — a skip, not a failure).
# The concurrency group stays cancel-in-progress: false — a scan is
# never killed mid-write, it is skipped before it starts.
#
# SESSIONS (v2.1): this workflow uses TELEGRAM_SESSION_STRING only.
# Newspapers uses TELEGRAM_SESSION_STRING_NEWS (a separate auth key
# for the same account, owner-generated). The runner refuses to
# start when both secrets hold the same value, and the lease
# refuses a second simultaneous session of either role — the
# AuthKeyDuplicatedError that killed realtime #702+ and newspapers
# #508+ on 2026-11-24, when one session was shared by both.
#
# Durability: this workflow does NOT commit index.db (the runner is
# ephemeral and committing every 5 minutes would flood the repo). The
# books are in the DO immediately (visible) and the daily sync (03:00 UTC)
# re-discovers the same new posts from the committed index.db and
# commits them durably. The DO append dedupes by book id, so a book
# found by both this check and the daily sync is never counted twice.
# The daily sync resets `live:additions` after it publishes, so the
# key always holds "books added since the last daily publish".
#
# What IS committed here, and only when it changed (v2.1):
#   * telegram/entity-cache.json — the runner auto-refreshes stale
#     entries (TTL 30 days) inside its resolve budget; a commit
#     happens only on runs where the file actually changed (a few
#     times a week at most, never every run).
#   * telegram/live-outbox.jsonl — written ONLY when the DO batch
#     PUT failed; the next run replays it before scanning.
#   * telegram/sql/entities.sql — regenerated whenever the cache
#     changed (the D1 entities table's source; applying it to D1
#     stays a manual owner step via wrangler).
#
# History: before v4.8.57 the two live keys lived in Cloudflare KV.
# KV's free tier allows 1,000 writes/day/account and the runs
# exhausted it daily (runs #382+ all failed with KV HTTP 429), so the
# keys moved to the bot's Durable Object (100,000 rows written/day).
#
# Secrets required (repo Settings -> Secrets and variables -> Actions):
#   TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_SESSION_STRING
#     (already configured — same as the api-backfill workflow)
#   LIVE_SYNC_TOKEN (the shared secret for the bot Worker's
#     /api/live-state endpoint — the SAME value as the Worker's
#     LIVE_SYNC_TOKEN secret; the owner adds it, no token value is
#     ever in the repo)
# The old Cloudflare KV secrets (CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID, RLIBOOK_KV_ID) are no longer used here.
name: telegram-realtime

on:
  # NO schedule: the 10-minute dispatcher cron is the only trigger.
  workflow_dispatch:
    inputs:
      catch_up:
        description: "Re-scan the sources the last scan failed before the normal check"
        required: false
        default: false
        type: boolean

# Two realtime runs must never overlap: they share the DO cursor.
concurrency:
  group: kindle-opds-static-telegram-realtime
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telegram
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Skip if another run is in progress
        # Layer 2 of the overlap dedup (v2.1): the dispatcher
        # already skips, but a manual dispatch can still collide
        # with a running scan. The current run itself is
        # in_progress, so exclude our own run id. Sets skip=true
        # and the steps below do not run (quiet success — the next
        # tick retries); it never fails the job.
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          other=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/telegram-realtime.yml/runs?status=in_progress&per_page=10" --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id] | length")
          if [ "$other" != "0" ]; then
            echo "another telegram-realtime run is already in progress ($other) — skipping this dispatch"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "no other telegram-realtime run in progress"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Decompress the seed DB (for the cursor seed)
        # Same as the daily sync: the repo stores ONLY index.db.gz.
        # live_sync seeds its DO cursor from the DB's newest_post_id
        # on the first run (so it catches every post since the last
        # daily sync). The decompressed DB is never committed here —
        # this workflow only writes the live state; the daily sync owns the
        # durable index.db.
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -f index.db.gz ]; then
            gunzip -f index.db.gz
          elif [ -f index.db ]; then
            echo "No index.db.gz — using the raw index.db."
          else
            echo "::warning::telegram/index.db.gz is missing — the cursor will seed from the live newest post instead."
          fi

      - name: Live sync (new-only -> DO live-additions)
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          LIVE_SYNC_TOKEN: ${{ secrets.LIVE_SYNC_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.catch_up }}" = "true" ]; then FLAGS="$FLAGS --catch-up"; fi
          python -m tbi.live_sync --config channels.yaml --db index.db $FLAGS

      - name: Commit entity cache + outbox when changed
        # v2.1: the runner auto-refreshes stale cache entries and
        # saves the outbox file ONLY when the DO push failed. Both
        # files are committed ONLY when they actually changed —
        # never every run (a commit every 10 minutes would flood
        # the repo). The D1 entities SQL is regenerated alongside
        # the cache so the table can be refreshed with one wrangler
        # call (applying it stays a manual owner step).
        if: always() && steps.guard.outputs.skip != 'true'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd telegram
          if [ -f entity-cache.json ]; then
            python3 -m tbi.d1_entities export --cache entity-cache.json --out sql/entities.sql || echo "::warning::entities.sql regeneration failed — committing the cache without it"
          fi
          cd ..
          git add telegram/entity-cache.json telegram/live-outbox.jsonl telegram/sql/entities.sql 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "live-sync: no cache/outbox change — nothing to commit"
            exit 0
          fi
          git commit -m "[live-sync] entity cache / outbox update"
          git pull --rebase --autostash origin main || { echo "::error::Rebase before push failed — check the output; do not force-push."; exit 1; }
          git push

      - name: Check bot /health (cursor age)
        # v2.0: after the sync, verify the bot actually holds a
        # fresh cursor — /health returns 200 while the cursor is
        # fresh and 503 when it is stale (>3600s) or never written.
        # Always runs (even if the sync step failed) and never fails
        # the job on its own — it only annotates.
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 https://rlibook-bot.mohamedyou1357.workers.dev/health)
          echo "bot /health HTTP $code: $(cat /tmp/health.json)"
          if [ "$code" != "200" ]; then
            echo "::warning::bot /health returned HTTP $code (expected 200) — cursor may be stale"
          fi
