# Telegram book index — MANUAL-ONLY API backfill, v0.6.0 (merged into kindle-opds-static).
#
# Runs the Telegram indexer (telegram/) through the MTProto API (Telethon)
# and publishes its section to Cloudflare Pages at /telegram/
# (site/telegram/ in this repo, reached through the _redirects rewrite at
# the repo root). The API reads a channel/group's FULL message history —
# including the old posts the web preview never serves, and the groups
# the preview cannot see at all.
#
# MANUAL ONLY (workflow_dispatch, no schedule): the API job runs only
# when the owner starts it, with an optional channel input. The daily
# preview job (.github/workflows/telegram-sync.yml) stays the default
# and never uses the API.
#
# MODES (input `mode`):
#   backfill (default) / new-only — as before.
#   rescan-formats — re-walk the already-indexed range of each source
#   to recover book files in the 16 formats the v0.5 expansion added
#   (DOCX/DOC/DJVU/CBZ/CHM/LIT/LRF/PDB/...). A full re-scan is ~40+
#   hours over all 211 sources, so it runs CHUNKED: each dispatch
#   processes chunk_size sources (default 10, ~2 h) starting at
#   chunk_index * chunk_size in config order (channels first, then
#   groups), one `tbi api-backfill --rescan-formats --channel <name>`
#   per source. Dispatch chunk 0, then 1, 2, ... until a chunk comes
#   back empty. Resume is by state file: each finished source is
#   recorded in telegram/rescan-progress.json (committed by the
#   Publish step, and by the failure step on timeout), and the next
#   run of the same chunk skips sources already in it — so a timeout
#   loses at most the in-progress source and re-dispatching the same
#   chunk resumes instead of redoing it. A --channel input overrides
#   the chunk (one source only, e.g. to retry a failed one). The
#   re-scan is idempotent (files are replaced, never appended), so
#   re-running a source is safe, just slower. When the whole cycle
#   is done, delete telegram/rescan-progress.json from the repo
#   before any future re-scan cycle (a stale file would skip
#   everything). DJVU/CBZ/CHM/LIT/LRF/PDB files recovered this way
#   still need conversion before email send.
#
# SECRETS (hard condition, set by the owner): the API credentials
# (api_id, api_hash, session string) live ONLY as GitHub Actions
# secrets — TELEGRAM_API_ID, TELEGRAM_API_HASH,
# TELEGRAM_SESSION_STRING — encrypted by GitHub, managed only by the
# repo owner. They are never in the repo, never in any file that gets
# pushed, and never printed in any log (this workflow only checks that
# they are *present*, never their values). The API job reads only
# configured channels/groups (channels.yaml) — never personal chats.
# Metadata only, legal sources only, no book files are downloaded.
#
# Protection layer (same as the preview job): per-channel isolation (one
# channel failing never stops the others), the DB is validated before
# publishing, the site is built in a staging directory and swapped in
# atomically (only if valid), the last-good site stays live on failure,
# and every run writes a report (index-report.md) that is published even
# when the run fails. Flood waits are honoured by the reader (backoff +
# resume from the same offset).
#
# Timeouts (v0.4.2 — same fix as the daily job): the API backfill
# walks the same 43 channels in 3000-post blocks, and the first manual
# preview run (2026-11-07) proved a full backfill needs ~200 minutes,
# past the old 100-minute Index-step limit. The Index step now allows
# 300 minutes and the job 360 (GitHub's per-job maximum). The failure
# step also saves the run's progress now (WAL checkpoint + validate +
# compressed seed) instead of only trying to commit a report that a
# timeout kill never wrote — see the "Save progress + report" step.
name: telegram-api-backfill

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "One configured channel/group only (empty = all configured)"
        required: false
        default: ""
        type: string
      mode:
        description: "Backfill (new posts + one block below oldest), new-only, or rescan-formats (re-walk indexed ranges to recover the 16 new formats)"
        required: false
        default: "backfill"
        type: choice
        options:
          - backfill
          - new-only
          - rescan-formats
      chunk_index:
        description: "Re-scan chunk to run (0-based; only used with mode rescan-formats)"
        required: false
        default: "0"
        type: string
      chunk_size:
        description: "Sources per re-scan chunk run (only used with mode rescan-formats)"
        required: false
        default: "10"
        type: string
      backfill_block:
        description: "Posts per backfill block per channel"
        required: false
        default: "3000"
        type: string

# The API job and the daily preview job share index.db — they must never
# overlap. Same concurrency group as telegram-sync.yml, so a run waits
# for the other to finish instead of racing it.
concurrency:
  group: kindle-opds-static-telegram-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  api-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: telegram
    steps:
      - uses: actions/checkout@v4

      - name: Decompress the seed DB
        run: |
          if ls index.db.gz.part-* 1>/dev/null 2>&1; then
            # v0.6.0: the seed is split into 20 MB parts (each under
            # Cloudflare Pages' 25 MB per-file limit); reassemble them
            # first, then decompress as before. The glob expands in
            # sorted order (part-aa, part-ab, ...), which is the
            # correct order for `split` output.
            cat index.db.gz.part-* > index.db.gz
            gunzip -f index.db.gz
          elif [ -f index.db.gz ]; then
            gunzip -f index.db.gz
          elif [ -f index.db ]; then
            echo "No index.db.gz — using the raw index.db (transition; it will be compressed on publish)."
          else
            echo "::error::telegram/index.db.gz is missing — the API backfill cannot start without the seed index (push it first, see telegram/PUSH_GUIDE.md)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the indexer (with the API extra)
        run: pip install -e ".[api]"

      - name: Seed check
        run: |
          if [ ! -f index.db ]; then
            echo "::error::telegram/index.db is missing (expected telegram/index.db.gz in the repo, decompressed above) — the API backfill cannot start without the seed index (push it first, see telegram/PUSH_GUIDE.md)."
            exit 1
          fi

      - name: Secrets check (presence only — values are never printed)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          python -c "
          import os, sys
          missing = [k for k in ('TELEGRAM_API_ID', 'TELEGRAM_API_HASH', 'TELEGRAM_SESSION_STRING') if not os.environ.get(k)]
          if missing:
              print('::error::Missing GitHub secret(s): ' + ', '.join(missing) + '. Add them in repo Settings -> Secrets and variables -> Actions (see telegram/README.md \"Telegram API history backfill\").')
              sys.exit(1)
          print('API secrets present (values not shown).')
          "

      - name: Index (API backfill)
        timeout-minutes: 300
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          if [ "${{ inputs.mode }}" = "rescan-formats" ]; then
            # --rescan-formats chunk (see the header comment): one
            # `tbi api-backfill --rescan-formats --channel <name>`
            # per source in this chunk, in config order (channels
            # first, then groups). Each source commits its writes to
            # index.db as it finishes (replace, never append), so a
            # timeout loses at most the in-progress source and the
            # failure step below still saves the DB. A --channel
            # input overrides the chunk (one source only).
            CHUNK_INDEX="${{ inputs.chunk_index }}"
            CHUNK_SIZE="${{ inputs.chunk_size }}"
            if [ -n "${{ inputs.channel }}" ]; then
              printf '%s\n' "${{ inputs.channel }}" > /tmp/rescan-chunk.txt
            else
              python3 -c "
          import json
          import re
          import sys
          from pathlib import Path
          import yaml
          def normalize(link):
              link = (link or '').strip()
              if not link:
                  return None
              link = re.sub(r'^https?://', '', link, flags=re.IGNORECASE)
              link = re.sub(r'^t\.me/(s/)?', '', link, flags=re.IGNORECASE)
              link = link.lstrip('@').split('/')[0].split('?')[0].strip()
              return link or None
          try:
              chunk_index = int(sys.argv[1])
              chunk_size = int(sys.argv[2])
          except ValueError:
              print('::error::chunk_index and chunk_size must be integers (got ' + repr(sys.argv[1]) + ' and ' + repr(sys.argv[2]) + ').', file=sys.stderr)
              raise SystemExit(2)
          if chunk_index < 0 or chunk_size < 1:
              print('::error::chunk_index must be >= 0 and chunk_size >= 1.', file=sys.stderr)
              raise SystemExit(2)
          cfg = yaml.safe_load(Path('channels.yaml').read_text(encoding='utf-8')) or {}
          sources = []
          for item in cfg.get('channels') or []:
              link = item if isinstance(item, str) else str(item.get('link', ''))
              name = normalize(link)
              if name:
                  sources.append(name)
          for item in cfg.get('groups') or []:
              name = item.get('name') if isinstance(item, dict) else item
              if name:
                  sources.append(str(name))
          progress = Path('rescan-progress.json')
          done = set()
          if progress.exists():
              done = set(json.loads(progress.read_text(encoding='utf-8')).get('completed', []))
          start = chunk_index * chunk_size
          for name in sources[start:start + chunk_size]:
              if name not in done:
                  print(name)
          " "$CHUNK_INDEX" "$CHUNK_SIZE" > /tmp/rescan-chunk.txt
            fi
            if [ ! -s /tmp/rescan-chunk.txt ]; then
              echo "Chunk $CHUNK_INDEX is empty — every source in it is already re-scanned (or it is past the last source). Nothing to do."
              exit 0
            fi
            echo "Re-scanning $(wc -l < /tmp/rescan-chunk.txt) source(s) in chunk $CHUNK_INDEX:"
            cat /tmp/rescan-chunk.txt
            while IFS= read -r NAME; do
              [ -n "$NAME" ] || continue
              echo "=== re-scanning $NAME ==="
              if tbi api-backfill --rescan-formats --channel "$NAME" 2>&1 | tee /tmp/rescan-last.log; then
                python3 -c "
          import json
          import sys
          from pathlib import Path
          progress = Path('rescan-progress.json')
          done = json.loads(progress.read_text(encoding='utf-8')) if progress.exists() else {'completed': []}
          if sys.argv[1] not in done['completed']:
              done['completed'].append(sys.argv[1])
          progress.write_text(json.dumps(done, indent=2) + chr(10), encoding='utf-8')
          " "$NAME"
              else
                echo "::warning::re-scan of $NAME failed — continuing with the next source in the chunk."
                if grep -q "flood-wait" /tmp/rescan-last.log; then
                  echo "::error::Telegram flood-wait stopped the chunk — re-dispatch it after the wait expires (sources already done are recorded in rescan-progress.json)."
                  break
                fi
              fi
            done < /tmp/rescan-chunk.txt
          else
            ARGS="--backfill --backfill-block ${{ inputs.backfill_block }}"
            if [ "${{ inputs.mode }}" = "new-only" ]; then
              ARGS="--new-only"
            fi
            if [ -n "${{ inputs.channel }}" ]; then
              ARGS="$ARGS --channel ${{ inputs.channel }}"
            fi
            tbi api-backfill $ARGS
          fi

      - name: Build the static site (staging)
        run: |
          tbi export-static --db index.db --out ../site/telegram.new --report index-report.md
          cp ../site/telegram/index.html ../site/telegram.new/index.html
          ls -la ../site/telegram.new

      - name: Validate before publish
        run: tbi validate --db index.db --json ../site/telegram.new/index.json

      - name: Publish atomically
        working-directory: .
        run: |
          rm -rf site/telegram
          mv site/telegram.new site/telegram
          # Compress the seed before committing: the repo stores ONLY
          # index.db.gz. A raw index.db over 25 MB breaks the Cloudflare
          # Pages deployment (25 MB per-file limit) and leaves /telegram/
          # on a 404. gzip -f replaces index.db with index.db.gz.
          gzip -f telegram/index.db
          # Split the seed (v0.6.0): the compressed DB is now ~66 MB,
          # over Cloudflare Pages' 25 MB per-file limit, so a single
          # index.db.gz breaks the deployment and the site serves stale
          # data. Split it into 20 MB parts (each under the limit) and
          # commit the parts; the Decompress step reassembles them.
          # Remove the old parts first (a smaller new DB has fewer).
          rm -f telegram/index.db.gz.part-*
          split -b 20M telegram/index.db.gz telegram/index.db.gz.part-
          rm -f telegram/index.db.gz
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram/index.db.gz.part-* telegram/index-report.md site/telegram/
          # The re-scan progress file (mode rescan-formats): the list
          # of sources already re-scanned, so the next chunk dispatch
          # resumes instead of redoing them. Tolerant add: absent on
          # backfill/new-only runs.
          git add telegram/rescan-progress.json 2>/dev/null || true
          # The entity cache (v0.4.8): the resolved handles must persist
          # across runs, or every run re-resolves all 211 handles and
          # trips the ResolveUsernameRequest flood wait again. Tolerant
          # add (|| true): the cache file is committed empty with
          # v0.4.8, but a missing file must never break a publish.
          git add telegram/entity-cache.json 2>/dev/null || true
          # Drop the raw seed from the repo if it is still tracked (the
          # transition commit); harmless once it is gone.
          git rm --cached telegram/index.db 2>/dev/null || true
          # Drop the old single-file seed too (v0.6.0 transition):
          # the repo now stores the split parts, not index.db.gz.
          git rm --cached telegram/index.db.gz 2>/dev/null || true
          git commit -m "[telegram-api-backfill] manual API backfill" || echo "nothing to commit"
          # Rebase before pushing (v0.4.7): a code push during a long
          # run used to reject this push (non-fast-forward) and lose
          # the run's work (run 42406045618, 2026-11-07: 1h22m of
          # indexing, commit 5848518, lost). The rebase replays this
          # commit on top of the current remote head (a code push
          # never touches these index/site files, so it applies
          # cleanly). --autostash is a no-op here (the tree is clean
          # after the commit) but keeps the command identical across
          # steps. Never force-push. If the rebase conflicts, fail
          # loudly instead of pushing or skipping.
          git pull --rebase --autostash origin main || { echo "::error::Rebase before push failed — the publish cannot be saved on top of the current remote head. Check the rebase output above; do not force-push."; exit 1; }
          git push

      - name: Save progress + report on failure (keeps the last-good site live)
        if: failure()
        run: |
          # A step timeout kills indexing before the report and publish
          # steps run, so without this step the whole run's progress
          # would be lost (that is what happened to the daily job on
          # 2026-11-07: the 100-minute Index timeout left no new commit
          # at all). The tool commits to SQLite after every completed
          # channel (and every 20 posts inside a channel — tbi/cli.py
          # _consume_walk, tbi/store.py set_progress), so the DB on disk
          # already holds everything except the last <20 posts of the
          # interrupted channel. Two gotchas handled here:
          #   1. The Store runs in WAL mode (tbi/store.py): committed
          #      rows may still sit in index.db-wal, so the WAL MUST be
          #      checkpointed into index.db BEFORE gzipping — gzipping
          #      the raw .db alone saves an (almost) empty database
          #      (verified on a kill-simulated DB: 0 posts without a
          #      checkpoint, all 25 with one). The Index process is dead
          #      by now (GitHub kills the timed-out step first), so
          #      opening the DB here is safe.
          #   2. Only a DB that still reads back cleanly is saved — a
          #      corrupt seed would poison every future run.
          # The live site is NOT touched: site/telegram/ keeps serving
          # the last-good publish until a later run succeeds.
          if [ -f index.db ]; then
            python3 -c "
          import sqlite3
          conn = sqlite3.connect('index.db')
          try:
              conn.execute('PRAGMA wal_checkpoint(TRUNCATE)')
              posts = conn.execute(
                  'SELECT COUNT(*) FROM posts').fetchone()[0]
              print(f'DB holds {posts} posts after WAL checkpoint')
          finally:
              conn.close()
          "
            if tbi validate --db index.db; then
              # Re-checkpoint: validate's own open recreates the FTS
              # triggers and may leave a fresh -wal behind.
              python3 -c "
          import sqlite3
          conn = sqlite3.connect('index.db')
          try:
              conn.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          finally:
              conn.close()
          "
              gzip -f index.db
              # Split the seed (v0.6.0): see the Publish step — the
              # compressed DB is over Pages' 25 MB per-file limit.
              rm -f index.db.gz.part-*
              split -b 20M index.db.gz index.db.gz.part-
              rm -f index.db.gz
            else
              echo "::warning::DB failed validation after checkpoint — not saving it; the last-good seed in the repo stays untouched."
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase before saving (v0.4.7): a code push during a long
          # run used to reject the failure-save push too, losing the
          # run's progress (run 42406045618, 2026-11-07). --autostash
          # is required here: the progress files are uncommitted at
          # this point, and a plain rebase refuses with unstaged
          # changes (verified in a shallow clone). The commit below is
          # then built on the current remote head. If the rebase
          # conflicts, fail loudly instead of pushing.
          git pull --rebase --autostash origin main || { echo "::error::Rebase before failure-save failed — the progress cannot be saved on top of the current remote head. Check the rebase output above; do not force-push."; exit 1; }
          git add index.db.gz.part-* 2>/dev/null || true
          git rm --cached index.db.gz 2>/dev/null || true
          git add index-report.md 2>/dev/null || true
          # The re-scan progress file (mode rescan-formats): without
          # it a timed-out chunk would redo its finished sources on
          # the next dispatch. Tolerant add, like the seed + report.
          git add rescan-progress.json 2>/dev/null || true
          # The entity cache (v0.4.8): the failure-save must persist
          # the newly resolved handles too, or the next run resolves
          # them again. Tolerant add, like the seed + report above.
          git add entity-cache.json 2>/dev/null || true
          git commit -m "[telegram-api-backfill] run failed — progress + report saved" || echo "nothing to commit"
          # One retry: the remote can move again between the rebase
          # and the push. Rebase once more and push once more; if that
          # still fails, give up (single retry, not a loop).
          if ! git push; then
            echo "::warning::Push failed — rebasing once and retrying the push."
            git pull --rebase --autostash origin main && git push || echo "could not push the failure save"
          fi
