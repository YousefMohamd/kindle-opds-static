# Telegram book index — scheduled sync, v0.6.0 (merged into kindle-opds-static).
#
# Runs the Telegram indexer (telegram/) and publishes its section to
# Cloudflare Pages at /telegram/ (site/telegram/ in this repo, reached
# through the _redirects rewrite at the repo root).
#
# Schedule: daily at 03:00 UTC, plus manual runs (workflow_dispatch).
# The job is --backfill: new posts first, then ONE block of 3000 posts
# below the oldest indexed post per channel per run, so the deep history
# beyond the local run's 3000-post cap fills in gradually over successive
# runs. A channel is complete when a block reaches post 1 or returns
# fewer than 3000 posts; once every channel is complete, backfill runs
# only check for new posts — the same as --new-only — and this workflow
# can be switched to `tbi index --new-only`.
#
# Timeouts (v0.4.2 — raised after the 2026-11-07 failure): the first
# manual run FAILED after 1h 40m — the "Index (backfill in blocks)"
# step hit its old 100-minute limit mid-channel (@twinkling4, ~540
# posts into its block) and nothing was committed, so the ~33,900
# posts / ~9,100 book files that run had indexed were lost and the
# published index stayed on the 2026-11-06 seed. A full 3000-post
# backfill of all 43 channels needs ~200 minutes at the observed pace
# (~34,000 posts in the first 100 minutes, ~12 channels still to go
# after the kill), so the Index step now allows 300 minutes and the
# job 360 (GitHub's per-job maximum). The block stays 3000 —
# shrinking it would only stretch the backfill over more runs.
#
# Protection layer (same as the OPDS deploy): per-channel isolation (one
# channel failing never stops the others), the DB is validated before
# publishing, the site is built in a staging directory and swapped in
# atomically (only if valid), and the last-good site stays live on
# failure. Since v0.4.2 the failure step also SAVES the run's progress:
# a step timeout kills indexing before the report and publish steps
# run, so the old failure step (report-only) committed nothing — the
# 2026-11-07 failure left no new commit at all. The tool commits to
# SQLite after every completed channel (and every 20 posts inside a
# channel), so the DB on disk already holds everything except the last
# <20 posts of the interrupted channel; the failure step checkpoints
# the WAL into it, validates it, and commits the compressed seed
# (index.db.gz) + report, so the next run resumes instead of
# restarting. See the "Save progress + report" step below.
#
# No API credentials, no Telegram login, no always-on server, no Mac:
# the job runs on GitHub's runner, reads public t.me/s/ previews only
# (metadata only — no book files are downloaded), and publishes a static
# site. The seed is committed in telegram/ by design — COMPRESSED as
# index.db.gz and SPLIT into 20 MB parts (index.db.gz.part-aa, ...),
# because the compressed DB is now ~66 MB, over Cloudflare Pages'
# 25 MB per-file limit (a single index.db.gz breaks the deployment and
# the site serves stale data). The job reassembles the parts and
# decompresses them at the start, and re-compresses + re-splits before
# committing; the raw .db and the single .gz are never committed.
name: telegram-sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Two telegram-sync runs must never overlap: they share index.db.
concurrency:
  group: kindle-opds-static-telegram-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: telegram
    steps:
      - uses: actions/checkout@v4

      - name: Decompress the seed DB
        run: |
          if ls index.db.gz.part-* 1>/dev/null 2>&1; then
            # v0.6.0: the seed is split into 20 MB parts (each under
            # Cloudflare Pages' 25 MB per-file limit); reassemble them
            # first, then decompress as before. The glob expands in
            # sorted order (part-aa, part-ab, ...), which is the
            # correct order for `split` output.
            cat index.db.gz.part-* > index.db.gz
            gunzip -f index.db.gz
          elif [ -f index.db.gz ]; then
            gunzip -f index.db.gz
          elif [ -f index.db ]; then
            echo "No index.db.gz — using the raw index.db (transition; it will be compressed on publish)."
          else
            echo "::error::telegram/index.db.gz is missing — the scheduled job cannot start without the seed index (push it first, see telegram/PUSH_GUIDE.md)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the indexer
        run: pip install -e .

      - name: Seed check
        run: |
          if [ ! -f index.db ]; then
            echo "::error::telegram/index.db is missing (expected telegram/index.db.gz in the repo, decompressed above) — the scheduled job cannot start without the seed index (push it first, see telegram/PUSH_GUIDE.md)."
            exit 1
          fi

      - name: Index (backfill in blocks)
        timeout-minutes: 300
        run: tbi index --backfill --backfill-block 3000

      - name: Build the static site (staging)
        run: |
          tbi export-static --db index.db --out ../site/telegram.new --report index-report.md
          # Job default cwd is telegram/ (see defaults above), so newest
          # needs PYTHONPATH=.. to find the telegram package at repo root.
          # Protection layer for newest.json (the /new page's feed):
          #   1. RETRY — run newest.py, and on failure run it a second
          #      time before giving up (a transient shard-read failure
          #      should not cost the day's feed).
          #   2. VALIDATE — the new file must be valid JSON, have a
          #      non-empty 'books' list, and be generated TODAY
          #      (generated_at, UTC — newest.py stamps it at build
          #      time). The newest BOOK's post date is deliberately
          #      NOT required to be today: on a quiet day no book was
          #      posted today, and the newest book is legitimately
          #      older — requiring it would reject a good file.
          #   3. FALLBACK — if the new file is missing or invalid,
          #      restore the PREVIOUS newest.json (live site/telegram/)
          #      into staging; if no previous file exists, delete the
          #      bad one so a broken file is never published (/new
          #      then shows its honest "not published yet" message).
          # Non-blocking throughout (|| echo / || true): a newest.json
          # failure must never kill the day's sync — the previous
          # newest.json stays live instead.
          PYTHONPATH=.. python3 -m telegram.tbi.newest --shard-dir ../site/telegram.new --out ../site/telegram.new/newest.json --limit 30 \
            || PYTHONPATH=.. python3 -m telegram.tbi.newest --shard-dir ../site/telegram.new --out ../site/telegram.new/newest.json --limit 30 \
            || echo "newest.json regeneration failed twice — keeping the previous newest.json"
          python3 - <<'PYEOF' || true
          import json, shutil
          from datetime import datetime, timezone
          from pathlib import Path
          new = Path("../site/telegram.new/newest.json")
          prev = Path("../site/telegram/newest.json")
          today = datetime.now(timezone.utc).date().isoformat()
          ok = False
          try:
              data = json.loads(new.read_text(encoding="utf-8"))
              books = data.get("books")
              gen = str(data.get("generated_at", ""))[:10]
              n = len(books) if isinstance(books, list) else -1
              ok = isinstance(books, list) and len(books) > 0 and gen == today
              print(f"newest.json check: books={n}, generated_at={gen!r}, today={today}, valid={ok}")
          except Exception as exc:
              print(f"newest.json check FAILED ({exc}) — treating as invalid")
          if not ok:
              if prev.is_file():
                  shutil.copyfile(prev, new)
                  print("newest.json invalid — restored the previous newest.json into staging")
              elif new.is_file():
                  new.unlink()
                  print("newest.json invalid and no previous file exists — removed the bad file so nothing broken is published")
              else:
                  print("newest.json missing and no previous file exists — /new will show its honest empty message")
          PYEOF
          cp ../site/telegram/index.html ../site/telegram.new/index.html
          ls -la ../site/telegram.new

      - name: Validate before publish
        run: tbi validate --db index.db --json ../site/telegram.new/index.json

      - name: Publish atomically
        working-directory: .
        run: |
          rm -rf site/telegram
          mv site/telegram.new site/telegram
          # Compress the seed before committing: the repo stores ONLY
          # index.db.gz. A raw index.db over 25 MB breaks the Cloudflare
          # Pages deployment (25 MB per-file limit) and leaves /telegram/
          # on a 404. gzip -f replaces index.db with index.db.gz.
          gzip -f telegram/index.db
          # Split the seed (v0.6.0): the compressed DB is now ~66 MB,
          # over Cloudflare Pages' 25 MB per-file limit, so a single
          # index.db.gz breaks the deployment and the site serves stale
          # data. Split it into 20 MB parts (each under the limit) and
          # commit the parts; the Decompress step reassembles them.
          # Remove the old parts first (a smaller new DB has fewer).
          rm -f telegram/index.db.gz.part-*
          split -b 20M telegram/index.db.gz telegram/index.db.gz.part-
          rm -f telegram/index.db.gz
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram/index.db.gz.part-* telegram/index-report.md site/telegram/
          # Drop the raw seed from the repo if it is still tracked (the
          # transition commit); harmless once it is gone.
          git rm --cached telegram/index.db 2>/dev/null || true
          # Drop the old single-file seed too (v0.6.0 transition):
          # the repo now stores the split parts, not index.db.gz.
          git rm --cached telegram/index.db.gz 2>/dev/null || true
          git commit -m "[telegram-sync] daily index update" || echo "nothing to commit"
          # Rebase before pushing (v0.4.7): a code push during a long
          # run used to reject this push (non-fast-forward) and lose
          # the run's work (run 42406045618, 2026-11-07: 1h22m of
          # indexing, commit 5848518, lost). The rebase replays this
          # commit on top of the current remote head (a code push
          # never touches these index/site files, so it applies
          # cleanly). --autostash is a no-op here (the tree is clean
          # after the commit) but keeps the command identical across
          # steps. Never force-push. If the rebase conflicts, fail
          # loudly instead of pushing or skipping.
          git pull --rebase --autostash origin main || { echo "::error::Rebase before push failed — the publish cannot be saved on top of the current remote head. Check the rebase output above; do not force-push."; exit 1; }
          git push

      - name: Save progress + report on failure (keeps the last-good site live)
        if: failure()
        run: |
          # A step timeout kills indexing before the report and publish
          # steps run, so without this step the whole run's progress
          # would be lost (that is what happened on 2026-11-07: the
          # 100-minute Index timeout left no new commit at all). The
          # tool commits to SQLite after every completed channel (and
          # every 20 posts inside a channel — tbi/cli.py _consume_walk,
          # tbi/store.py set_progress), so the DB on disk already holds
          # everything except the last <20 posts of the interrupted
          # channel. Two gotchas handled here:
          #   1. The Store runs in WAL mode (tbi/store.py): committed
          #      rows may still sit in index.db-wal, so the WAL MUST be
          #      checkpointed into index.db BEFORE gzipping — gzipping
          #      the raw .db alone saves an (almost) empty database
          #      (verified on a kill-simulated DB: 0 posts without a
          #      checkpoint, all 25 with one). The Index process is dead
          #      by now (GitHub kills the timed-out step first), so
          #      opening the DB here is safe.
          #   2. Only a DB that still reads back cleanly is saved — a
          #      corrupt seed would poison every future run.
          # The live site is NOT touched: site/telegram/ keeps serving
          # the last-good publish until a later run succeeds.
          if [ -f index.db ]; then
            python3 -c "
          import sqlite3
          conn = sqlite3.connect('index.db')
          try:
              conn.execute('PRAGMA wal_checkpoint(TRUNCATE)')
              posts = conn.execute(
                  'SELECT COUNT(*) FROM posts').fetchone()[0]
              print(f'DB holds {posts} posts after WAL checkpoint')
          finally:
              conn.close()
          "
            if tbi validate --db index.db; then
              # Re-checkpoint: validate's own open recreates the FTS
              # triggers and may leave a fresh -wal behind.
              python3 -c "
          import sqlite3
          conn = sqlite3.connect('index.db')
          try:
              conn.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          finally:
              conn.close()
          "
              gzip -f index.db
              # Split the seed (v0.6.0): see the Publish step — the
              # compressed DB is over Pages' 25 MB per-file limit.
              rm -f index.db.gz.part-*
              split -b 20M index.db.gz index.db.gz.part-
              rm -f index.db.gz
            else
              echo "::warning::DB failed validation after checkpoint — not saving it; the last-good seed in the repo stays untouched."
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase before saving (v0.4.7): a code push during a long
          # run used to reject the failure-save push too, losing the
          # run's progress (run 42406045618, 2026-11-07). --autostash
          # is required here: the progress files are uncommitted at
          # this point, and a plain rebase refuses with unstaged
          # changes (verified in a shallow clone). The commit below is
          # then built on the current remote head. If the rebase
          # conflicts, fail loudly instead of pushing.
          git pull --rebase --autostash origin main || { echo "::error::Rebase before failure-save failed — the progress cannot be saved on top of the current remote head. Check the rebase output above; do not force-push."; exit 1; }
          git add index.db.gz.part-* 2>/dev/null || true
          git rm --cached index.db.gz 2>/dev/null || true
          git add index-report.md 2>/dev/null || true
          git commit -m "[telegram-sync] run failed — progress + report saved" || echo "nothing to commit"
          # One retry: the remote can move again between the rebase
          # and the push. Rebase once more and push once more; if that
          # still fails, give up (single retry, not a loop).
          if ! git push; then
            echo "::warning::Push failed — rebasing once and retrying the push."
            git pull --rebase --autostash origin main && git push || echo "could not push the failure save"
          fi
