# Daily newspapers (جرائد اليوم) — link-out only.
#
# Regenerates site/newspapers.json once a day and publishes it with the
# static site. The generator OVERWRITES the file every run, so
# yesterday's papers disappear the moment today's are written; when no
# source yields a paper, the file is still written (empty lists,
# "empty": true) and the pages show "لا يوجد جرائد اليوم" instead of
# rendering broken or stale papers. The generator also bakes the day's
# papers as plain HTML into index.html and site/newspapers/index.html
# (static — the Kindle browser has no fetch(), so the pages must not
# depend on the JSON); the commit step below must add those two pages
# alongside the JSON, or the baked content goes stale.
#
# Sources (see telegram/tbi/newspapers.py for the verification notes):
#   * Hub @arabJournalism — public, but its t.me/s/ preview currently
#     serves no posts (redirect to the info card), so the preview path
#     alone yields nothing; the API path below is what actually reads it.
#   * Fallback invite-link channel — API-only (no preview exists).
#   * Private Egyptian channel — the owner's join request is PENDING;
#     the generator NEVER joins, so this source stays
#     unavailable_pending_join until the owner is a member.
#
# The API path needs the SAME GitHub Actions secrets as the manual
# api-backfill (TELEGRAM_API_ID / TELEGRAM_API_HASH /
# TELEGRAM_SESSION_STRING) — encrypted secrets, never in the repo, never
# logged. If they are absent the job still succeeds and publishes an
# honest empty-day file (the generator records per-source statuses in
# the file itself). No PDF is ever downloaded, stored, or served: each
# entry is only a link to its Telegram post.
#
# Schedule: 06:00 UTC = 08:00 Africa/Cairo — after the morning papers
# drop. Manual runs (workflow_dispatch) any time. This job never touches
# the book index or the long telegram-sync job.
name: telegram-newspapers

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: kindle-opds-static-telegram-newspapers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  newspapers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telegram
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the generator (+ Telethon for the API path)
        run: pip install -e ".[api]"

      - name: Generate today's newspapers
        run: python3 -m tbi.newspapers --out ../site/newspapers.json

      - name: Fallback — write an empty-day file if generation failed
        if: failure()
        run: python3 -m tbi.newspapers --out ../site/newspapers.json --write-empty

      - name: Commit + push
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The baked static pages must be committed too, or the
          # Kindle-browser pages go stale (they do not fetch the JSON).
          git add site/newspapers.json index.html site/newspapers/index.html
          git commit -m "[newspapers] daily update" || echo "nothing to commit"
          # Rebase before pushing (same pattern as telegram-sync): a code
          # push during the run must not lose this commit. Never force-push.
          git pull --rebase --autostash origin main || { echo "::error::Rebase before push failed — check the output; do not force-push."; exit 1; }
          git push
