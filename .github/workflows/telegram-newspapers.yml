# Newspapers — SMART publishing: watch (every 10 min) + backstop.
#
# The watch publishes within ~10-12 min of the hub posting a batch
# (04:00 / 07:00 / Egypt ~10:00 Cairo — no fixed time). The backstops
# are insurance only, for when the trigger is down: 09:30 UTC
# (11:30 Cairo — the observed "morning complete" time, 4 days
# straight) and 15:00 UTC (17:00 Cairo, straggler catch). The 06:00
# UTC run is removed: it fires before Egypt papers exist.
#
# The generator NEVER overwrites a good page with a much smaller one:
# see guard_publish() in telegram/tbi/newspapers.py (steep-drop <50%,
# Egypt-section loss, failed-read, premature-empty rules). A blocked
# run exits 0 without writing; the next watch retries in 10 min.
# The old --write-empty crash fallback is gone: a crash writes
# nothing and keeps the old page.
#
# Sources, links, and the no-download rule are unchanged (see
# telegram/tbi/newspapers.py). The generator never joins anything.
# Secrets: the same 3 Telegram secrets as before. No new secrets.
name: telegram-newspapers

on:
  schedule:
    - cron: "30 9 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch = publish only if the hub has new papers; backstop = full regenerate (guard still applies)"
        required: false
        default: "backstop"
        type: choice
        options: [watch, backstop]

concurrency:
  group: kindle-opds-static-telegram-newspapers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  newspapers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telegram
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the generator (+ Telethon for the API path)
        run: pip install -e ".[api]"

      - name: Generate today's newspapers
        run: |
          if [ "${{ inputs.mode }}" = "watch" ]; then
            python3 -m tbi.newspapers --out ../site/newspapers.json --watch
          else
            python3 -m tbi.newspapers --out ../site/newspapers.json --force
          fi

      - name: Commit + push (only when the files changed)
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The baked static pages must be committed too, or the
          # Kindle-browser pages go stale (they do not fetch the JSON).
          git add site/newspapers.json index.html site/newspapers/index.html
          if git diff --cached --quiet; then
            echo "newspapers: no change — nothing to commit"
            exit 0
          fi
          git commit -m "[newspapers] update"
          # Rebase before pushing (same pattern as telegram-sync): a code
          # push during the run must not lose this commit. Never force-push.
          git pull --rebase --autostash origin main || { echo "::error::Rebase before push failed — check the output; do not force-push."; exit 1; }
          git push
