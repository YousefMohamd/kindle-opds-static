# Telegram book index — SLOW group joining, v0.4.6 (merged into kindle-opds-static).
#
# The owner is a member of only ~5% of the 168 configured groups, and
# the API (Telethon, acting as his account) can only read a group's
# history once he is a member. This workflow closes that gap — slowly
# and safely, with no terminal work from the owner: every 12 hours it
# joins up to 2 pending groups (long pauses between joins), adds each
# joined group to his Telegram chat folder "📚كتب", indexes each newly
# joined group with the API backfill, and publishes — so the catalogue
# fills in over ~6 weeks (~4 groups/day) and the owner only checks
# join-state.json / join-report.md in the repo every few days.
#
# SCHEDULED (every 12 h) + manual dispatch — but the joins are still
# slow by design (2 per run, 120–180 s pauses). Joining is the most
# rate-limited thing a Telegram account can do; a bulk join would
# trigger a flood wait and could restrict the owner's account, so this
# job never hurries. A flood wait stops the run immediately, is
# recorded in join-state.json, and the next scheduled run does not
# attempt anything until the wait has expired.
#
# SECRETS (hard condition, set by the owner): the API credentials
# (api_id, api_hash, session string) live ONLY as GitHub Actions
# secrets — TELEGRAM_API_ID, TELEGRAM_API_HASH,
# TELEGRAM_SESSION_STRING — encrypted by GitHub, managed only by the
# repo owner. They are never in the repo, never in any file that gets
# pushed, and never printed in any log (this workflow only checks that
# they are *present*, never their values). The joiner reads only
# configured groups (channels.yaml) — never personal chats — and only
# joins and organises; the indexing is metadata only, legal sources
# only, no book files are downloaded.
#
# Protection layer (same as the API backfill job): per-group isolation
# (one group failing never stops the others), the DB is validated
# before publishing, the site is built in a staging directory and
# swapped in atomically (only if valid), the last-good site stays live
# on failure, and every run writes a report (join-report.md, plus
# index-report.md when groups were indexed). The join state is saved
# after every group, so a timeout kill never loses a join; the failure
# step saves the run's progress the same way the API backfill's does.
#
# Zero-joined runs are normal (all pending groups failed, a flood wait
# stopped the run, or the sweep is done): the workflow still commits
# the updated join-state.json + join-report.md, but skips the
# index/site publish (nothing new to index). It does NOT fail the run
# just because nothing was joined.
#
# Timeouts: the join step is fast (2 groups, 120–180 s pauses) and the
# per-group backfill is one 3000-post block each, so the job allows
# 120 minutes and the Index step 60 — generous, bounded, and far
# below GitHub's per-job maximum.
name: telegram-join-groups

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Groups to attempt per run (default 2)"
        required: false
        default: "2"
        type: string

# The join job shares index.db and join-state.json with the other
# telegram jobs — it must never overlap them. Same concurrency group
# as telegram-sync.yml and telegram-api-backfill.yml, so a run waits
# for the other to finish instead of racing it.
concurrency:
  group: kindle-opds-static-telegram-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  join-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: telegram
    steps:
      - uses: actions/checkout@v4

      - name: Decompress the seed DB
        run: |
          if [ -f index.db.gz ]; then
            gunzip -f index.db.gz
          elif [ -f index.db ]; then
            echo "No index.db.gz — using the raw index.db (transition; it will be compressed on publish)."
          else
            echo "::error::telegram/index.db.gz is missing — the join job cannot start without the seed index (push it first, see telegram/PUSH_GUIDE.md)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the indexer (with the API extra)
        run: pip install -e ".[api]"

      - name: Seed check
        run: |
          if [ ! -f index.db ]; then
            echo "::error::telegram/index.db is missing (expected telegram/index.db.gz in the repo, decompressed above) — the join job cannot start without the seed index (push it first, see telegram/PUSH_GUIDE.md)."
            exit 1
          fi

      - name: Secrets check (presence only — values are never printed)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          python -c "
          import os, sys
          missing = [k for k in ('TELEGRAM_API_ID', 'TELEGRAM_API_HASH', 'TELEGRAM_SESSION_STRING') if not os.environ.get(k)]
          if missing:
              print('::error::Missing GitHub secret(s): ' + ', '.join(missing) + '. Add them in repo Settings -> Secrets and variables -> Actions (see telegram/README.md \"Telegram API history backfill\").')
              sys.exit(1)
          print('API secrets present (values not shown).')
          "

      - name: Join groups (slow, safe)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          # Batch comes from the manual input; on a schedule the input
          # is empty, so default to 2. tbi join-groups writes
          # newly-joined.txt (one name per line, empty when nothing
          # was joined) + join-report.md + the updated join-state.json.
          tbi join-groups --batch "${{ inputs.batch || '2' }}"

      - name: Check what was joined
        id: check
        run: |
          if [ -s newly-joined.txt ]; then
            echo "joined=true" >> "$GITHUB_OUTPUT"
            echo "count=$(wc -l < newly-joined.txt)" >> "$GITHUB_OUTPUT"
            echo "Newly joined groups:"
            cat newly-joined.txt
          else
            echo "joined=false" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No groups were joined in this run (all failed, a flood wait stopped it, or the sweep is done) — the join state + report are still committed below."
          fi

      - name: Index newly joined groups (API backfill)
        if: steps.check.outputs.joined == 'true'
        timeout-minutes: 60
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          # One 3000-post backfill block per newly joined group (new
          # posts first, then the block below the oldest — a fresh
          # group has no posts yet, so this walks its first 3000).
          # Per-group isolation: one group's backfill failing never
          # stops the others (the group stays "joined" in the state
          # and the manual api-backfill picks it up on a later run).
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "Indexing newly joined group: $name"
            tbi api-backfill --channel "$name" --backfill --backfill-block 3000 \
              || echo "::warning::backfill failed for $name — recorded in the report; continuing with the next group"
          done < newly-joined.txt
          # NOTE: each api-backfill invocation rewrites index-report.md,
          # so the published report covers the last group indexed in
          # this run; join-report.md is this run's full record.

      - name: Build the static site (staging)
        if: steps.check.outputs.joined == 'true'
        run: |
          tbi export-static --db index.db --out ../site/telegram.new --report index-report.md
          cp ../site/telegram/index.html ../site/telegram.new/index.html
          ls -la ../site/telegram.new

      - name: Validate before publish
        if: steps.check.outputs.joined == 'true'
        run: tbi validate --db index.db --json ../site/telegram.new/index.json

      - name: Publish atomically
        if: steps.check.outputs.joined == 'true'
        working-directory: .
        run: |
          rm -rf site/telegram
          mv site/telegram.new site/telegram
          # Compress the seed before committing: the repo stores ONLY
          # index.db.gz. A raw index.db over 25 MB breaks the Cloudflare
          # Pages deployment (25 MB per-file limit) and leaves /telegram/
          # on a 404. gzip -f replaces index.db with index.db.gz.
          gzip -f telegram/index.db
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram/index.db.gz telegram/index-report.md site/telegram/
          git add telegram/join-state.json telegram/join-report.md
          # The entity cache (v0.4.8): the resolved handles must persist
          # across runs, or every run re-resolves all 211 handles and
          # trips the ResolveUsernameRequest flood wait again. Tolerant
          # add (|| true): the cache file is committed empty with
          # v0.4.8, but a missing file must never break a publish.
          git add telegram/entity-cache.json 2>/dev/null || true
          # Drop the raw seed from the repo if it is still tracked (the
          # transition commit); harmless once it is gone.
          git rm --cached telegram/index.db 2>/dev/null || true
          git commit -m "[telegram-join-groups] slow join run — new groups indexed" || echo "nothing to commit"
          # Rebase before pushing (v0.4.7): a code push during a long
          # run used to reject this push (non-fast-forward) and lose
          # the run's work (run 42406045618, 2026-11-07: 1h22m of
          # indexing, commit 5848518, lost). The rebase replays this
          # commit on top of the current remote head (a code push
          # never touches these index/site files, so it applies
          # cleanly). --autostash is a no-op here (the tree is clean
          # after the commit) but keeps the command identical across
          # steps. Never force-push. If the rebase conflicts, fail
          # loudly instead of pushing or skipping.
          git pull --rebase --autostash origin main || { echo "::error::Rebase before push failed — the publish cannot be saved on top of the current remote head. Check the rebase output above; do not force-push."; exit 1; }
          git push

      - name: Commit join state only (nothing newly joined)
        if: steps.check.outputs.joined != 'true'
        run: |
          # A zero-joined run still records its outcome: the updated
          # join-state.json (failures / flood wait / already-member
          # marks) and join-report.md. The live site is untouched.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add join-state.json join-report.md 2>/dev/null || true
          # The entity cache (v0.4.8): a zero-joined run may still
          # have resolved new handles — persist them. Tolerant add.
          git add entity-cache.json 2>/dev/null || true
          git commit -m "[telegram-join-groups] slow join run — no new groups joined" || echo "nothing to commit"
          # Rebase before pushing (v0.4.7): same fix as the Publish
          # step — a code push during the run used to reject this push
          # and lose the recorded join state. Fail loudly on a rebase
          # conflict instead of pushing or skipping.
          git pull --rebase --autostash origin main || { echo "::error::Rebase before push failed — the join state cannot be saved on top of the current remote head. Check the rebase output above; do not force-push."; exit 1; }
          git push || echo "could not push the join state"

      - name: Save progress + report on failure (keeps the last-good site live)
        if: failure()
        run: |
          # Same failure-save as the API backfill job: a step timeout
          # kills the run before the publish step, so without this the
          # whole run's progress would be lost. The join state is
          # already saved after every group (tbi join-groups), and the
          # DB already holds everything except the last <20 posts of
          # the interrupted group — checkpoint the WAL into it,
          # validate, and commit the compressed seed + reports. The
          # live site is NOT touched.
          if [ -f index.db ]; then
            python3 -c "
          import sqlite3
          conn = sqlite3.connect('index.db')
          try:
              conn.execute('PRAGMA wal_checkpoint(TRUNCATE)')
              posts = conn.execute(
                  'SELECT COUNT(*) FROM posts').fetchone()[0]
              print(f'DB holds {posts} posts after WAL checkpoint')
          finally:
              conn.close()
          "
            if tbi validate --db index.db; then
              # Re-checkpoint: validate's own open recreates the FTS
              # triggers and may leave a fresh -wal behind.
              python3 -c "
          import sqlite3
          conn = sqlite3.connect('index.db')
          try:
              conn.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          finally:
              conn.close()
          "
              gzip -f index.db
            else
              echo "::warning::DB failed validation after checkpoint — not saving it; the last-good seed in the repo stays untouched."
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase before saving (v0.4.7): a code push during a long
          # run used to reject the failure-save push too, losing the
          # run's progress (run 42406045618, 2026-11-07). --autostash
          # is required here: the progress files are uncommitted at
          # this point, and a plain rebase refuses with unstaged
          # changes (verified in a shallow clone). The commit below is
          # then built on the current remote head. If the rebase
          # conflicts, fail loudly instead of pushing.
          git pull --rebase --autostash origin main || { echo "::error::Rebase before failure-save failed — the progress cannot be saved on top of the current remote head. Check the rebase output above; do not force-push."; exit 1; }
          git add index.db.gz 2>/dev/null || true
          git add index-report.md 2>/dev/null || true
          git add join-state.json join-report.md 2>/dev/null || true
          # The entity cache (v0.4.8): the failure-save must persist
          # the newly resolved handles too, or the next run resolves
          # them again. Tolerant add, like the files above.
          git add entity-cache.json 2>/dev/null || true
          git commit -m "[telegram-join-groups] run failed — progress + report saved" || echo "nothing to commit"
          # One retry: the remote can move again between the rebase
          # and the push. Rebase once more and push once more; if that
          # still fails, give up (single retry, not a loop).
          if ! git push; then
            echo "::warning::Push failed — rebasing once and retrying the push."
            git pull --rebase --autostash origin main && git push || echo "could not push the failure save"
          fi
